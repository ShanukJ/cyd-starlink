name: Feature request
description: Suggest an improvement or a new feature.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The project stays standalone by design: no cloud services, accounts, MQTT, Home Assistant or outgoing telemetry.
        Ideas that need those are out of scope.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should the monitor do? Mock-ups or sketches welcome.
  - type: textarea
    id: data
    attributes:
      label: Data needed
      description: Does the dish report what this needs? If you know the field (for example from `grpcurl` reflection), name it.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Dashboard / screens
        - Web settings page
        - WiFi / setup
        - Starlink data
        - New hardware
        - Installer / releases
        - Other
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this myself
