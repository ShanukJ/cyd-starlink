name: CI

# Every push / PR: host unit tests + release builds for all boards.
# Tag v*: additionally publish a GitHub Release and deploy the web flasher
#         (with its firmware) to GitHub Pages.
# Manual run ("Run workflow" on main, give a tag): (re)deploy the web
#         flasher for an existing release. No GitHub Release.
# The flasher must serve the firmware itself: browsers can't fetch GitHub
# Release assets cross-origin.
#
# GitHub Pages setup (one time, see docs/development/release.md):
#   Settings -> Pages -> Source: GitHub Actions
#   Settings -> Environments -> github-pages -> add tag rule "v*"
#   (without the tag rule, tag-triggered deploys are rejected; manual runs
#    from main still work)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to deploy to the web flasher (e.g. v0.1.0)"
        required: true

permissions:
  contents: read

env:
  # The ref being built: the dispatched tag, or whatever triggered the run.
  BUILD_REF: ${{ inputs.tag || github.ref_name }}
  IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0  # tags, for the version

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/.pio/libdeps
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Host unit tests
        working-directory: firmware
        run: pio test -e native

      - name: Tag matches VERSION file
        if: env.IS_RELEASE == 'true'
        run: |
          if [ "${BUILD_REF#v}" != "$(cat VERSION)" ]; then
            echo "::error::Tag $BUILD_REF does not match VERSION $(cat VERSION)"; exit 1
          fi

      - name: Build all boards
        working-directory: firmware
        run: python scripts/release.py

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/firmware

      - uses: actions/upload-pages-artifact@v3
        if: env.IS_RELEASE == 'true'
        with:
          path: dist/site

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "Starlink Monitor ${GITHUB_REF_NAME#v}" --generate-notes \
            firmware/*.bin firmware/SHA256SUMS

  flasher:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency: github-pages  # never two deploys at once
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
