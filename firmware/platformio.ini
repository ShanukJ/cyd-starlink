; Starlink Monitor — PlatformIO build configuration
;
; One environment per hardware target. All targets share the same source
; tree; the hardware profile is selected with a single -D flag
; (see src/hardware/profiles/Profiles.h).
;
;   pio run -e cyd_2432s028_st7789      build firmware
;   pio test -e native                  host unit tests (decoder, health)

[platformio]
default_envs = cyd_2432s028_st7789

; ---------------------------------------------------------------------------
; Shared settings for every ESP32 target
; ---------------------------------------------------------------------------
[esp32]
; pioarduino platform = Arduino-ESP32 core 3.3.x on ESP-IDF 5.5.
; Pinned so builds are reproducible.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
framework = arduino

; 4 MB flash: two 1.9 MB OTA app slots + small SPIFFS. Keeps OTA possible
; later without repartitioning devices in the field.
board_build.partitions = min_spiffs.csv
board_build.flash_mode = dio

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 460800

lib_deps =
    lovyan03/LovyanGFX@1.2.32
    lvgl/lvgl@9.5.0

build_flags =
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
    -D CORE_DEBUG_LEVEL=1
    -Wall

; ---------------------------------------------------------------------------
; ESP32-2432S028 ("Cheap Yellow Display"), ST7789 panel, XPT2046 touch
; ---------------------------------------------------------------------------
[env:cyd_2432s028_st7789]
extends = esp32
board = esp32dev
build_flags =
    ${esp32.build_flags}
    -D HW_PROFILE_ESP32_2432S028_ST7789

; ---------------------------------------------------------------------------
; Host unit tests. Only hardware-independent code is compiled, with
; AddressSanitizer + UBSan so out-of-bounds reads fail the tests.
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_build_src = yes
build_src_filter =
    -<*>
    +<starlink/ProtoReader.cpp>
    +<starlink/StatusDecoder.cpp>
    +<starlink/StarlinkStatus.cpp>
    +<starlink/Health.cpp>
    +<starlink/Diagnostics.cpp>
    +<starlink/HistoryDecoder.cpp>
    +<starlink/HistoryBuffer.cpp>
    +<config/SettingsValidation.cpp>
    +<utils/JsonWriter.cpp>
    +<ui/Format.cpp>
    +<ui/AlignmentMath.cpp>
build_flags =
    -std=gnu++17
    -I src
    -Wall
    -g
    -fsanitize=address,undefined
    -fno-omit-frame-pointer
    -fno-sanitize-recover=all
build_unflags = -std=gnu++11
extra_scripts = post:scripts/native_sanitizer_link.py
